<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário Dinâmico Avançado</title>
<style>
/* =====================================================
   CONFIGURAÇÃO GERAL E MODO ESCURO
   ===================================================== */
:root { color-scheme: light dark; }
html, body {
    background-color: #191919 !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
}
@media (prefers-color-scheme: light) {
    html, body { background-color: #ffffff !important; color: #191919; }
    .status { background: #eeeeee !important; }
    .grid-cell { background: #d8d8d8 !important; border-color: #ccc !important; }
    .inventory-box { background: #e0e0e0 !important; border-color: #ccc !important; }
    .inv-header { color: #333 !important; }
}
* { box-sizing: border-box; }

.status-container {
    width: 100%;
    max-width: 800px; /* Aumentado levemente para comportar grids maiores */
    margin: 0 auto;
    padding: 10px;
}

.status {
    background: #373737;
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 12px;
}

.status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
}

.status-title-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-icon {
    width: 17px;
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
}

.status-name {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.3px;
}

/* =====================================================
   PAINÉIS DE FORMULÁRIOS (ITENS E BOLSAS)
   ===================================================== */
.form-panel {
    background: rgba(0,0,0,0.2);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 15px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
}

.form-panel-title {
    width: 100%;
    font-size: 10px;
    font-weight: bold;
    color: #aaa;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.form-panel input, .form-panel button {
    background: #242424;
    border: 1px solid #444;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
}
@media (prefers-color-scheme: light) {
    .form-panel input { background: #fff; color: #191919; border-color: #bbb; }
}

.form-panel input[type="number"] { width: 55px; }
.form-panel input[type="text"], .form-panel input[type="url"] { flex: 1; min-width: 120px; }

.btn-add {
    background: #27b879 !important;
    border: none !important;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    color: #fff !important;
}
.btn-add:hover { opacity: 0.8; }

.btn-add-secondary {
    background: #318cff !important;
    border: none !important;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    color: #fff !important;
}
.btn-add-secondary:hover { opacity: 0.8; }

/* =====================================================
   INVENTÁRIOS E GRID (CONTAINERS)
   ===================================================== */
#inventoriesContainer {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: flex-start;
}

.inventory-box {
    background: #202020;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #444;
    width: fit-content;
}

.inv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 4px;
}

.inv-title {
    font-size: 12px;
    font-weight: bold;
    color: #ddd;
    letter-spacing: 0.5px;
}

.inv-delete {
    color: #ff4b4b;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}
.inv-delete:hover { color: #ff7676; text-decoration: underline; }

.grid-container {
    display: grid;
    gap: 3px;
    position: relative;
    user-select: none;
}

.grid-cell {
    width: 48px;
    height: 48px;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 3px;
    pointer-events: auto;
}

.grid-cell.drag-over {
    background: rgba(39, 184, 121, 0.3) !important;
    border-color: #27b879 !important;
}

/* =====================================================
   ESTILO DOS ITENS DENTRO DO GRID
   ===================================================== */
.inventory-item {
    border-radius: 4px;
    color: #fff;
    padding: 4px;
    font-size: 10px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: grab;
    z-index: 10;
    box-shadow: 0 2px 5px rgba(0,0,0,0.6);
    transition: transform 0.1s;
    position: relative;
    overflow: hidden;
}

.inventory-item:active { cursor: grabbing; transform: scale(0.98); }

/* Fundo da imagem */
.item-img-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    opacity: 0.8; /* Leve transparência para mesclar com a cor do item */
}

/* Camada escura por cima da imagem para garantir leitura do texto */
.item-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
    z-index: 2;
}

/* Conteúdo do item (texto, botões) */
.item-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
}

.item-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
}

.item-name {
    pointer-events: none;
    word-break: break-word;
    line-height: 1.1;
}

.item-delete {
    color: #ff4b4b;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    line-height: 0.8;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    padding: 2px 4px;
    margin-left: 4px;
}
.item-delete:hover { color: #ff7676; background: rgba(0,0,0,0.8); }

.item-size {
    font-size: 8px;
    opacity: 0.8;
    align-self: flex-end;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="status-container">
    <div class="status">
        <div class="status-header">
            <div class="status-title-group">
                <span class="status-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M20 8h-3V6c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6h6v2H9V6zm11 14H4V10h3v1c0 .55.45 1 1 1s1-.45 1-1v-1h6v1c0 .55.45 1 1 1s1-.45 1-1v-1h3v10z"/>
                    </svg>
                </span>
                <span class="status-name">SISTEMA DE INVENTÁRIOS</span>
            </div>
        </div>

        <!-- Adicionar Item -->
        <div class="form-panel">
            <div class="form-panel-title">Criar Novo Item</div>
            <input type="text" id="itemName" placeholder="Nome (ex: Pistola)" autocomplete="off">
            <input type="url" id="itemUrl" placeholder="URL da Imagem (Opcional)" autocomplete="off">
            <input type="number" id="itemW" placeholder="Lrg" min="1" max="10" value="2" title="Largura em células">
            <input type="number" id="itemH" placeholder="Alt" min="1" max="10" value="2" title="Altura em células">
            <button id="btnAddItem" class="btn-add" type="button">+ Add Item</button>
        </div>

        <!-- Adicionar Bolsa/Inventário Extra -->
        <div class="form-panel">
            <div class="form-panel-title">Criar Nova Bolsa / Recipiente</div>
            <input type="text" id="invName" placeholder="Nome (ex: Cartucheira)" autocomplete="off">
            <input type="number" id="invCols" placeholder="Colunas" min="1" max="15" value="4" title="Largura total do grid">
            <input type="number" id="invRows" placeholder="Linhas" min="1" max="15" value="3" title="Altura total do grid">
            <button id="btnAddInv" class="btn-add-secondary" type="button">+ Criar Bolsa</button>
        </div>

        <!-- Container onde todos os grids serão injetados -->
        <div id="inventoriesContainer"></div>

    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyD2qEEAPbzP1RFVnx2ijnEyCXB3VWzfz-8",
    authDomain: "ficha-verum.firebaseapp.com",
    databaseURL: "https://ficha-verum-default-rtdb.firebaseio.com",
    projectId: "ficha-verum",
    storageBucket: "ficha-verum.firebasestorage.app",
    messagingSenderId: "281172832426",
    appId: "1:281172832426:web:85442662439544144fa0d3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player') || 'jogador_teste';
const dbRef = ref(db, `fichas/${playerName}_inventario_avancado`);

// Estado Global (Salvo no Firebase)
let state = {
    inventories: [
        { id: "inv_main", name: "Mochila Principal", cols: 8, rows: 6 } // Inventário Padrão Indestrutível
    ],
    items: []
};

let isInitialized = false;
let draggedItemId = null;

const container = document.getElementById("inventoriesContainer");

/* =====================================================
   FIREBASE SYNC
   ===================================================== */
onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
        state.inventories = data.inventories || [{ id: "inv_main", name: "Mochila Principal", cols: 8, rows: 6 }];
        state.items = data.items || [];
    }
    renderAll();
    isInitialized = true;
});

function saveState() {
    if (!isInitialized) return;
    set(dbRef, state);
}

/* =====================================================
   RENDERIZAÇÃO GLOBAL (Bolsas e Itens)
   ===================================================== */
function renderAll() {
    container.innerHTML = "";

    // 1. Renderiza os containers das bolsas
    state.inventories.forEach(inv => {
        const box = document.createElement("div");
        box.className = "inventory-box";
        
        // Cabeçalho da bolsa
        let headerHtml = `<div class="inv-header">
                            <span class="inv-title">${inv.name} (${inv.cols}x${inv.rows})</span>`;
        if (inv.id !== "inv_main") { // Impede exclusão da mochila principal
            headerHtml += `<span class="inv-delete" data-id="${inv.id}">Deletar</span>`;
        }
        headerHtml += `</div>`;

        // Grid CSS
        const grid = document.createElement("div");
        grid.className = "grid-container";
        grid.id = `grid_${inv.id}`;
        grid.style.gridTemplateColumns = `repeat(${inv.cols}, 48px)`;
        grid.style.gridTemplateRows = `repeat(${inv.rows}, 48px)`;

        // Cria as células de fundo
        for (let r = 0; r < inv.rows; r++) {
            for (let c = 0; c < inv.cols; c++) {
                const cell = document.createElement("div");
                cell.className = "grid-cell";
                cell.dataset.invid = inv.id;
                cell.dataset.col = c;
                cell.dataset.row = r;

                // Eventos Drop da célula
                cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("drag-over"); });
                cell.addEventListener("dragleave", () => cell.classList.remove("drag-over"));
                cell.addEventListener("drop", (e) => {
                    e.preventDefault();
                    cell.classList.remove("drag-over");
                    handleDrop(inv.id, c, r);
                });

                grid.appendChild(cell);
            }
        }

        box.innerHTML = headerHtml;
        box.appendChild(grid);
        container.appendChild(box);
    });

    // Eventos de Excluir Bolsa
    document.querySelectorAll(".inv-delete").forEach(btn => {
        btn.addEventListener("click", (e) => {
            const id = e.target.getAttribute("data-id");
            if (confirm("Tem certeza? Todos os itens dentro desta bolsa também serão perdidos.")) {
                deleteInventory(id);
            }
        });
    });

    // 2. Renderiza os itens dentro das bolsas corretas
    state.items.forEach(item => {
        const gridDom = document.getElementById(`grid_${item.invId}`);
        if (!gridDom) return; // Se a bolsa não existe mais (fallback), ignora render

        const itemEl = document.createElement("div");
        itemEl.className = "inventory-item";
        itemEl.draggable = true;

        itemEl.style.gridColumnStart = item.x + 1;
        itemEl.style.gridColumnEnd = `span ${item.w}`;
        itemEl.style.gridRowStart = item.y + 1;
        itemEl.style.gridRowEnd = `span ${item.h}`;
        
        itemEl.style.backgroundColor = item.color.bg;
        itemEl.style.border = `1px solid ${item.color.border}`;

        // Se houver imagem, adiciona a camada de fundo
        let imgHtml = "";
        if (item.imgUrl) {
            imgHtml = `<div class="item-img-bg" style="background-image: url('${item.imgUrl}');"></div>
                       <div class="item-overlay"></div>`;
        }

        itemEl.innerHTML = `
            ${imgHtml}
            <div class="item-content">
                <div class="item-header">
                    <span class="item-name">${item.nome}</span>
                    <span class="item-delete" data-id="${item.id}" title="Excluir item">×</span>
                </div>
                <span class="item-size">${item.w}x${item.h}</span>
            </div>
        `;

        itemEl.addEventListener("dragstart", () => { draggedItemId = item.id; });
        
        itemEl.querySelector(".item-delete").addEventListener("click", (e) => {
            e.stopPropagation();
            deleteItem(item.id);
        });

        gridDom.appendChild(itemEl);
    });
}

/* =====================================================
   LÓGICA DE COLISÃO E DROPS
   ===================================================== */
function canPlaceItem(id, targetInvId, targetX, targetY, w, h) {
    const inv = state.inventories.find(i => i.id === targetInvId);
    if (!inv) return false;
    
    // Fora dos limites da bolsa alvo?
    if (targetX + w > inv.cols || targetY + h > inv.rows) return false;

    // Colisão com outros itens na mesma bolsa?
    for (let item of state.items) {
        if (item.id === id) continue;
        if (item.invId !== targetInvId) continue; 

        const overlapX = targetX < item.x + item.w && targetX + w > item.x;
        const overlapY = targetY < item.y + item.h && targetY + h > item.y;
        if (overlapX && overlapY) return false; 
    }
    return true;
}

function handleDrop(targetInvId, targetX, targetY) {
    if (!draggedItemId) return;
    const item = state.items.find(i => i.id === draggedItemId);
    if (!item) return;

    if (canPlaceItem(item.id, targetInvId, targetX, targetY, item.w, item.h)) {
        item.invId = targetInvId;
        item.x = targetX;
        item.y = targetY;
        saveState();
    }
    draggedItemId = null;
}

/* =====================================================
   AÇÕES DO FORMULÁRIO (ADD ITEM E ADD BOLSA)
   ===================================================== */
document.getElementById("btnAddItem").addEventListener("click", () => {
    const nome = document.getElementById("itemName").value.trim() || "Item";
    const imgUrl = document.getElementById("itemUrl").value.trim();
    const w = parseInt(document.getElementById("itemW").value) || 1;
    const h = parseInt(document.getElementById("itemH").value) || 1;

    let placed = false;

    // Busca espaço na ordem: Principal -> Bolsa 1 -> Bolsa 2...
    for (let inv of state.inventories) {
        for (let r = 0; r <= inv.rows - h; r++) {
            for (let c = 0; c <= inv.cols - w; c++) {
                if (canPlaceItem(null, inv.id, c, r, w, h)) {
                    state.items.push({
                        id: "item_" + Date.now(),
                        invId: inv.id,
                        nome: nome,
                        imgUrl: imgUrl,
                        x: c, y: r, w: w, h: h,
                        color: getRandomColor()
                    });
                    saveState();
                    placed = true;
                    break;
                }
            }
            if (placed) break;
        }
        if (placed) break;
    }

    if (!placed) alert("Nenhuma bolsa tem espaço suficiente para este item!");
    
    document.getElementById("itemName").value = "";
    document.getElementById("itemUrl").value = "";
});

document.getElementById("btnAddInv").addEventListener("click", () => {
    const name = document.getElementById("invName").value.trim() || "Nova Bolsa";
    const cols = parseInt(document.getElementById("invCols").value) || 4;
    const rows = parseInt(document.getElementById("invRows").value) || 3;

    state.inventories.push({
        id: "inv_" + Date.now(),
        name: name,
        cols: cols,
        rows: rows
    });
    
    saveState();
    document.getElementById("invName").value = "";
});

function deleteItem(id) {
    state.items = state.items.filter(i => i.id !== id);
    saveState();
}

function deleteInventory(invId) {
    // Remove a bolsa
    state.inventories = state.inventories.filter(i => i.id !== invId);
    // Remove os itens que estavam dentro dela
    state.items = state.items.filter(i => i.invId !== invId);
    saveState();
}

function getRandomColor() {
    const colors = [
        { bg: "rgba(49, 140, 255, 0.3)", border: "#318cff" },
        { bg: "rgba(39, 184, 121, 0.3)", border: "#27b879" },
        { bg: "rgba(169, 88, 232, 0.3)", border: "#a958e8" },
        { bg: "rgba(255, 165, 0, 0.3)",  border: "#ffa500" },
        { bg: "rgba(200, 50, 50, 0.3)",  border: "#ff4b4b" }
    ];
    return colors[Math.floor(Math.random() * colors.length)];
}
</script>
</body>
</html>
