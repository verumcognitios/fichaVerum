<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário Dinâmico Avançado</title>
<style>
/* =====================================================
   CONFIGURAÇÃO GERAL E MODO ESCURO
   ===================================================== */
:root { color-scheme: light dark; }
html, body {
    background-color: #191919 !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
}
@media (prefers-color-scheme: light) {
    html, body { background-color: #ffffff !important; color: #191919; }
    .status { background: #eeeeee !important; }
    .grid-cell { background: #d8d8d8 !important; border-color: #ccc !important; }
    .inventory-box { background: #e0e0e0 !important; border-color: #ccc !important; }
    .inv-header { color: #333 !important; }
    .tabs-container { border-bottom-color: #ccc !important; }
    .tab { background: #d0d0d0 !important; color: #333 !important; }
    .tab.active { background: #e0e0e0 !important; border-bottom-color: #e0e0e0 !important; font-weight: bold; }
    .btn-config { color: #555 !important; }
}
* { box-sizing: border-box; }

.status-container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px;
}

.status {
    background: #373737;
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 12px;
}

.status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
}

.status-title-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-icon {
    width: 17px;
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
}

.status-name {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.3px;
}

.btn-config {
    background: transparent;
    border: none;
    color: #ccc;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: bold;
    padding: 5px 8px;
    border-radius: 4px;
    transition: background 0.2s;
}
.btn-config:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* =====================================================
   SISTEMA DE ABAS
   ===================================================== */
.tabs-container {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    border-bottom: 2px solid #444;
    padding-bottom: 2px;
    flex-wrap: wrap;
}

.tab {
    background: #242424;
    border: 1px solid #444;
    border-bottom: none;
    color: #aaa;
    padding: 8px 14px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
}

.tab:hover { background: #2a2a2a; color: #fff; }

.tab.active {
    background: #202020;
    color: #fff;
    font-weight: bold;
    border-color: #555;
    border-bottom: 2px solid #202020;
    margin-bottom: -4px;
    padding-bottom: 10px;
}

.tab-delete {
    color: #ff4b4b;
    font-weight: bold;
    font-size: 14px;
    opacity: 0.6;
}
.tab-delete:hover { opacity: 1; }

.btn-tab-add {
    background: transparent;
    border: 1px dashed #555;
    color: #aaa;
    padding: 4px 12px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}
.btn-tab-add:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #888; }


/* =====================================================
   PAINEL DE FORMULÁRIO (CRIAR ITEM)
   ===================================================== */
.form-panel {
    background: rgba(0,0,0,0.2);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 15px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
}

.form-panel-title {
    width: 100%;
    font-size: 10px;
    font-weight: bold;
    color: #aaa;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.form-panel input, .form-panel button {
    background: #242424;
    border: 1px solid #444;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
}
@media (prefers-color-scheme: light) {
    .form-panel input { background: #fff; color: #191919; border-color: #bbb; }
}

.form-panel input[type="number"] { width: 55px; }
.form-panel input[type="text"] { flex: 1; min-width: 120px; }

.btn-add {
    background: #27b879 !important;
    border: none !important;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    color: #fff !important;
}
.btn-add:hover { opacity: 0.8; }

/* =====================================================
   INVENTÁRIO E GRID
   ===================================================== */
#inventoriesContainer {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: flex-start;
}

.inventory-box {
    background: #202020;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #444;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.grid-container {
    display: grid;
    gap: 3px;
    position: relative;
    user-select: none;
}

.grid-cell {
    width: 56px;
    height: 56px;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 4px;
    pointer-events: auto;
}

/* LINHA DE SOBRECARGA */
.grid-cell-overload {
    background: repeating-linear-gradient(
        -45deg,
        rgba(255, 75, 75, 0.04),
        rgba(255, 75, 75, 0.04) 6px,
        rgba(255, 75, 75, 0.12) 6px,
        rgba(255, 75, 75, 0.12) 12px
    ) !important;
    border-color: rgba(255, 75, 75, 0.25) !important;
}

/* =====================================================
   ESTILO DOS ITENS DENTRO DO GRID
   ===================================================== */
.inventory-item {
    border-radius: 4px;
    color: #fff;
    padding: 5px;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer; /* Alterado de grab para pointer */
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    transition: transform 0.1s, box-shadow 0.2s;
    position: relative;
    overflow: visible;
}

.inventory-item:hover { z-index: 20; }
.inventory-item:active { transform: scale(0.98); }

/* Classe para o item selecionado (Brilho branco) */
.inventory-item.selected {
    z-index: 50; /* Sempre no topo quando estiver flutuando */
}

.inventory-item.selected.valid {
    box-shadow: 0 0 14px 2px rgba(39, 184, 121, 0.8);
    border-color: #27b879 !important;
    transform: scale(1.02);
}

.inventory-item.selected.invalid {
    box-shadow: 0 0 15px 3px rgba(255, 75, 75, 0.8);
    border-color: #ff4b4b !important;
    opacity: 0.65;
    transform: scale(1.02);
}

.inventory-item.selected.invalid .item-overlay {
    background: linear-gradient(to bottom, rgba(255,0,0,0.5) 0%, rgba(255,0,0,0.1) 40%, rgba(255,0,0,0.5) 100%);
}

.item-img-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    opacity: 0.8;
    border-radius: 4px;
}

.item-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%);
    z-index: 2;
    border-radius: 4px;
}

.item-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
}

.item-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
}

.item-name {
    pointer-events: none;
    word-break: break-word;
    line-height: 1.1;
}

.item-actions {
    display: flex;
    gap: 3px;
}

.item-edit, .item-delete {
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    line-height: 1;
    background: rgba(0,0,0,0.6);
    border-radius: 3px;
    padding: 3px 5px;
}

.item-edit { color: #318cff; }
.item-edit:hover { color: #66a8ff; background: rgba(0,0,0,0.9); }
.item-delete { color: #ff4b4b; }
.item-delete:hover { color: #ff7676; background: rgba(0,0,0,0.9); }

.item-size {
    font-size: 9px;
    opacity: 0.8;
    align-self: flex-end;
    pointer-events: none;
}

/* TOOLTIP NO HOVER */
.item-tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #eee;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: normal;
    white-space: pre-wrap;
    width: max-content;
    max-width: 200px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.9);
    border: 1px solid #555;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    z-index: 100;
    text-shadow: none;
    line-height: 1.3;
}

.inventory-item:hover .item-tooltip { visibility: visible; opacity: 1; }

/* =====================================================
   JANELAS MODAIS (EDIÇÃO E CONFIG)
   ===================================================== */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(3px);
}

.modal-content {
    background: #242424;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 18px;
    width: 90%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

.modal-content h3 {
    margin: 0 0 4px 0;
    font-size: 14px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.modal-content label {
    font-size: 10px;
    color: #aaa;
    margin-bottom: -8px;
    font-weight: bold;
    text-transform: uppercase;
}

.modal-content input, .modal-content textarea, .modal-content select {
    background: #181818;
    border: 1px solid #444;
    color: #fff;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
}

.btn-cancel {
    background: #444 !important;
    border: none !important;
    color: #fff !important;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}
.btn-cancel:hover { background: #555 !important; }
</style>
</head>
<body>

<div class="status-container">
    <div class="status">
        <div class="status-header">
            <div class="status-title-group">
                <span class="status-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M20 8h-3V6c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6h6v2H9V6zm11 14H4V10h3v1c0 .55.45 1 1 1s1-.45 1-1v-1h6v1c0 .55.45 1 1 1s1-.45 1-1v-1h3v10z"/>
                    </svg>
                </span>
                <span class="status-name">INVENTÁRIO & BOLSAS (MODO TECLADO)</span>
            </div>
            
            <button id="btnOpenSettings" class="btn-config">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
                Configurar Grid
            </button>
        </div>

        <div id="tabsContainer" class="tabs-container">
            <!-- Abas injetadas via JS -->
        </div>

        <div class="form-panel">
            <div class="form-panel-title">Criar Item na Aba Atual</div>
            <input type="text" id="itemName" placeholder="Nome (ex: Espada)" autocomplete="off">
            <input type="number" id="itemW" placeholder="Lrg" min="1" max="8" value="1" title="Largura">
            <input type="number" id="itemH" placeholder="Alt" min="1" max="6" value="2" title="Altura">
            <button id="btnAddItem" class="btn-add" type="button">+ Add Item</button>
        </div>

        <!-- Dica de Controles -->
        <div style="font-size: 11px; color: #888; margin-bottom: 10px; line-height: 1.4;">
            <strong>Controles:</strong> Clique no item para pegá-lo. Use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> para mover e <kbd>R</kbd> para girar.<br>
            <span style="color:#27b879">Verde</span> = Livre. <span style="color:#ff4b4b">Vermelho/Transparente</span> = Inválido (bloqueado). <kbd>Enter</kbd> ou Clique para confirmar. <kbd>Esc</kbd> cancela.
        </div>

        <div id="inventoriesContainer"></div>
    </div>
</div>

<!-- Modal de Configuração do Grid -->
<div id="configModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Capacidade do Personagem</h3>
        <label for="configCols">Largura do Grid (Colunas)</label>
        <input type="number" id="configCols" min="4" max="20" value="8">
        
        <label for="configRows">Altura do Grid (Linhas)</label>
        <input type="number" id="configRows" min="4" max="20" value="6">
        
        <div class="modal-actions">
            <button id="btnCancelConfig" class="btn-cancel" type="button">Cancelar</button>
            <button id="btnSaveConfig" class="btn-add" type="button">Salvar Config.</button>
        </div>
    </div>
</div>

<!-- Modal de Edição de Item -->
<div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Editar Item</h3>
        <label for="editItemName">Nome</label>
        <input type="text" id="editItemName" autocomplete="off">
        
        <label for="editItemUrl">URL da Imagem</label>
        <input type="url" id="editItemUrl" placeholder="https://..." autocomplete="off">
        
        <label for="editItemCategory">Categoria / Tipo</label>
        <select id="editItemCategory">
            <option value="default">Geral (Azul)</option>
            <option value="consumable">Suplementos/Consumíveis (Verde)</option>
            <option value="weapon">Armas (Laranja)</option>
            <option value="special">Especial (Roxo)</option>
            <option value="key">Missão (Vermelho)</option>
        </select>
        
        <label for="editItemDesc">Descrição</label>
        <textarea id="editItemDesc" rows="3" placeholder="Escreva a descrição..."></textarea>
        
        <div class="modal-actions">
            <button id="btnCancelEdit" class="btn-cancel" type="button">Cancelar</button>
            <button id="btnSaveEdit" class="btn-add" type="button">Salvar</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyD2qEEAPbzP1RFVnx2ijnEyCXB3VWzfz-8",
    authDomain: "ficha-verum.firebaseapp.com",
    databaseURL: "https://ficha-verum-default-rtdb.firebaseio.com",
    projectId: "ficha-verum",
    storageBucket: "ficha-verum.firebasestorage.app",
    messagingSenderId: "281172832426",
    appId: "1:281172832426:web:85442662439544144fa0d3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player') || 'jogador_teste';
const dbRef = ref(db, `fichas/${playerName}_inventario_avancado`);

const CELL_SIZE = 56;
const CELL_GAP = 3;

// Categorias de Cores
const CATEGORIES = {
    "default": { bg: "rgba(49, 140, 255, 0.4)", border: "#318cff" },
    "consumable": { bg: "rgba(39, 184, 121, 0.4)", border: "#27b879" },
    "special": { bg: "rgba(169, 88, 232, 0.4)", border: "#a958e8" },
    "weapon": { bg: "rgba(255, 165, 0, 0.4)",  border: "#ffa500" },
    "key": { bg: "rgba(200, 50, 50, 0.4)",  border: "#ff4b4b" }
};

// Estado Global
let state = {
    config: { cols: 8, rows: 6 },
    tabs: [
        { id: "tab_main", name: "Mochila Principal", items: [] }
    ]
};

let currentTabId = "tab_main";
let isInitialized = false;
let editingItemId = null;
let activeItemPreview = null; // { id, x, y, w, h } - Controle do item "flutuando"

const container = document.getElementById("inventoriesContainer");
const tabsContainer = document.getElementById("tabsContainer");

/* =====================================================
   FIREBASE SYNC & MIGRAÇÃO
   ===================================================== */
onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.tabs && data.config) {
            state = data;
        } else {
            state.config = data.config || { cols: 8, rows: 6 };
            state.tabs = [
                { id: "tab_main", name: "Mochila Principal", items: data.items || [] }
            ];
        }
    }
    
    if (!state.tabs.find(t => t.id === currentTabId)) {
        currentTabId = state.tabs[0]?.id || "tab_main";
    }
    
    // Se o item selecionado/flutuando não existe mais (deletado por outro), limpa
    const currentTab = getCurrentTab();
    if (activeItemPreview && currentTab && !currentTab.items.find(i => i.id === activeItemPreview.id)) {
        activeItemPreview = null;
    }
    
    renderAll();
    isInitialized = true;
});

function saveState() {
    if (!isInitialized) return;
    set(dbRef, state);
}

function getCurrentTab() {
    return state.tabs.find(t => t.id === currentTabId);
}

/* =====================================================
   RENDERIZAÇÃO GLOBAL
   ===================================================== */
function renderAll() {
    // 1. Renderiza Abas
    tabsContainer.innerHTML = "";
    state.tabs.forEach((tab, index) => {
        const btn = document.createElement("button");
        btn.className = `tab ${tab.id === currentTabId ? "active" : ""}`;
        btn.textContent = tab.name;
        
        if (state.tabs.length > 1) {
            const del = document.createElement("span");
            del.className = "tab-delete";
            del.textContent = " ×";
            del.title = "Excluir aba";
            del.onclick = (e) => {
                e.stopPropagation();
                if (confirm(`Excluir a bolsa "${tab.name}" e todos os seus itens?`)) {
                    state.tabs = state.tabs.filter(t => t.id !== tab.id);
                    if (currentTabId === tab.id) currentTabId = state.tabs[0].id;
                    saveState();
                }
            };
            btn.appendChild(del);
        }

        btn.onclick = () => { 
            currentTabId = tab.id; 
            activeItemPreview = null; // Reseta a seleção ao mudar de aba
            renderAll(); 
        };
        tabsContainer.appendChild(btn);
    });

    const addTabBtn = document.createElement("button");
    addTabBtn.className = "btn-tab-add";
    addTabBtn.textContent = "+ Nova Bolsa";
    addTabBtn.onclick = () => {
        const name = prompt("Nome da nova bolsa/aba:");
        if (name && name.trim() !== "") {
            const newId = "tab_" + Date.now();
            state.tabs.push({ id: newId, name: name.trim(), items: [] });
            currentTabId = newId;
            saveState();
        }
    };
    tabsContainer.appendChild(addTabBtn);

    // 2. Renderiza o Grid da Aba Atual
    container.innerHTML = "";
    const currentTab = getCurrentTab();
    if (!currentTab) return;

    const cols = state.config.cols;
    const rows = state.config.rows;

    const box = document.createElement("div");
    box.className = "inventory-box";

    const grid = document.createElement("div");
    grid.className = "grid-container";
    grid.style.gridTemplateColumns = `repeat(${cols}, ${CELL_SIZE}px)`;
    grid.style.gridTemplateRows = `repeat(${rows}, ${CELL_SIZE}px)`;

    // Renderiza Células Vazias
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            
            // Marca a última linha como Sobrecarga
            if (r === rows - 1) {
                cell.classList.add("grid-cell-overload");
                cell.title = "Área de Sobrecarga";
            }
            
            cell.style.gridColumn = `${c + 1}`;
            cell.style.gridRow = `${r + 1}`;
            grid.appendChild(cell);
        }
    }

    // Renderiza Itens da Aba
    const items = currentTab.items || [];
    items.forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = "inventory-item";
        itemEl.dataset.id = item.id;
        
        // Posição Base vs Preview
        let renderX = item.x;
        let renderY = item.y;
        let renderW = item.w;
        let renderH = item.h;
        let isSelected = false;
        let isValid = true;

        if (activeItemPreview && activeItemPreview.id === item.id) {
            isSelected = true;
            renderX = activeItemPreview.x;
            renderY = activeItemPreview.y;
            renderW = activeItemPreview.w;
            renderH = activeItemPreview.h;
            isValid = canPlaceItem(item.id, renderX, renderY, renderW, renderH);
            
            itemEl.classList.add("selected");
            if (isValid) itemEl.classList.add("valid");
            else itemEl.classList.add("invalid");
        }

        itemEl.style.gridColumn = `${renderX + 1} / span ${renderW}`;
        itemEl.style.gridRow = `${renderY + 1} / span ${renderH}`;
        itemEl.style.backgroundColor = item.color.bg;
        itemEl.style.border = `1px solid ${item.color.border}`;

        let imgHtml = item.imgUrl ? `<div class="item-img-bg" style="background-image: url('${item.imgUrl}');"></div><div class="item-overlay"></div>` : "";
        let tooltipHtml = (item.descricao && item.descricao.trim()) ? `<div class="item-tooltip"><strong>${item.nome}</strong><br>${item.descricao}</div>` : "";

        itemEl.innerHTML = `
            ${imgHtml}
            <div class="item-content">
                <div class="item-header">
                    <span class="item-name">${item.nome}</span>
                    <div class="item-actions">
                        <span class="item-edit" data-id="${item.id}" title="Editar">✎</span>
                        <span class="item-delete" data-id="${item.id}" title="Excluir">×</span>
                    </div>
                </div>
                <span class="item-size">${renderW}x${renderH}</span>
            </div>
            ${tooltipHtml}
        `;

        // Evento de clique para selecionar/confirmar o item
        itemEl.addEventListener("click", (e) => {
            e.stopPropagation(); // Evita que clique na janela desmarque
            
            // Ignora se clicou nos botões de ação
            if(e.target.closest('.item-actions')) return;

            if (activeItemPreview && activeItemPreview.id !== item.id) {
                // Estava segurando OUTRO item e clicou neste
                // Se o anterior for válido, salva ele antes de pegar o novo
                if (canPlaceItem(activeItemPreview.id, activeItemPreview.x, activeItemPreview.y, activeItemPreview.w, activeItemPreview.h)) {
                    const tab = getCurrentTab();
                    const prevItem = tab.items.find(i => i.id === activeItemPreview.id);
                    if(prevItem) {
                        prevItem.x = activeItemPreview.x; prevItem.y = activeItemPreview.y;
                        prevItem.w = activeItemPreview.w; prevItem.h = activeItemPreview.h;
                        saveState();
                    }
                }
                // Pega o novo item
                activeItemPreview = { id: item.id, x: item.x, y: item.y, w: item.w, h: item.h };
                renderAll();
            } else if (activeItemPreview && activeItemPreview.id === item.id) {
                // Clicou no MESMO item que está segurando. Tenta confirmar a posição.
                if (canPlaceItem(activeItemPreview.id, activeItemPreview.x, activeItemPreview.y, activeItemPreview.w, activeItemPreview.h)) {
                    item.x = activeItemPreview.x; item.y = activeItemPreview.y;
                    item.w = activeItemPreview.w; item.h = activeItemPreview.h;
                    activeItemPreview = null;
                    saveState();
                }
                // Se for inválido, não faz nada (continua flutuando vermelho)
            } else {
                // Não estava segurando nada, pega este item
                activeItemPreview = { id: item.id, x: item.x, y: item.y, w: item.w, h: item.h };
                renderAll();
            }
        });
        
        itemEl.querySelector(".item-edit").addEventListener("click", (e) => { e.stopPropagation(); openEditModal(item.id); });
        itemEl.querySelector(".item-delete").addEventListener("click", (e) => { e.stopPropagation(); deleteItem(item.id); });

        grid.appendChild(itemEl);
    });

    box.appendChild(grid);
    container.appendChild(box);
}

/* =====================================================
   LÓGICA DE COLISÃO
   ===================================================== */
function canPlaceItem(id, targetX, targetY, w, h) {
    const cols = state.config.cols;
    const rows = state.config.rows;
    
    // Verifica limites do grid
    if (targetX < 0 || targetY < 0) return false;
    if (targetX + w > cols || targetY + h > rows) return false;

    // Verifica sobreposição com outros itens
    const items = getCurrentTab().items || [];
    for (let item of items) {
        if (item.id === id) continue;
        const overlapX = targetX < item.x + item.w && targetX + w > item.x;
        const overlapY = targetY < item.y + item.h && targetY + h > item.y;
        if (overlapX && overlapY) return false; 
    }
    return true;
}

/* =====================================================
   CONTROLES GLOBAIS DE TECLADO E CLIQUE FORA
   ===================================================== */
// Clique global no documento
document.addEventListener("click", (e) => {
    if (activeItemPreview && !e.target.closest('.inventory-item') && !e.target.closest('.modal-content')) {
        // Clicou fora de qualquer item. Tenta confirmar a posição atual.
        if (canPlaceItem(activeItemPreview.id, activeItemPreview.x, activeItemPreview.y, activeItemPreview.w, activeItemPreview.h)) {
            const tab = getCurrentTab();
            const item = tab.items.find(i => i.id === activeItemPreview.id);
            if(item) {
                item.x = activeItemPreview.x; item.y = activeItemPreview.y;
                item.w = activeItemPreview.w; item.h = activeItemPreview.h;
                saveState();
            }
        }
        // Se for inválido (ou após salvar), apenas deseleciona cancelando o preview
        activeItemPreview = null;
        renderAll();
    }
});

// Controles de teclado
document.addEventListener("keydown", (e) => {
    // Ignora atalhos caso esteja digitando em um input ou textarea
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

    if (!activeItemPreview) return; // Só move/rotaciona se houver item flutuando

    // Tecla ESC para cancelar e deselecionar
    if (e.key === "Escape") {
        activeItemPreview = null;
        renderAll();
        return;
    }

    // Tecla Enter para confirmar a posição
    if (e.key === "Enter") {
        if (canPlaceItem(activeItemPreview.id, activeItemPreview.x, activeItemPreview.y, activeItemPreview.w, activeItemPreview.h)) {
            const tab = getCurrentTab();
            const item = tab.items.find(i => i.id === activeItemPreview.id);
            if(item) {
                item.x = activeItemPreview.x; item.y = activeItemPreview.y;
                item.w = activeItemPreview.w; item.h = activeItemPreview.h;
                activeItemPreview = null;
                saveState();
            }
        }
        return; // Se inválido, ignora o Enter
    }

    let newX = activeItemPreview.x;
    let newY = activeItemPreview.y;
    let newW = activeItemPreview.w;
    let newH = activeItemPreview.h;
    
    const key = e.key.toLowerCase();
    let moved = false;

    // Movimentação
    if (key === 'w' || e.key === 'ArrowUp') { newY -= 1; moved = true; }
    else if (key === 's' || e.key === 'ArrowDown') { newY += 1; moved = true; }
    else if (key === 'a' || e.key === 'ArrowLeft') { newX -= 1; moved = true; }
    else if (key === 'd' || e.key === 'ArrowRight') { newX += 1; moved = true; }
    
    // Rotação
    else if (key === 'r') {
        newW = activeItemPreview.h;
        newH = activeItemPreview.w;
        moved = true;
    }

    if (moved) {
        // Previne rolagem da tela se usar as setas
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
        }

        activeItemPreview.x = newX;
        activeItemPreview.y = newY;
        activeItemPreview.w = newW;
        activeItemPreview.h = newH;
        
        // Apenas renderiza a alteração localmente (preview), sem salvar no Firebase
        renderAll();
    }
});

/* =====================================================
   CRIAR NOVO ITEM
   ===================================================== */
document.getElementById("btnAddItem").addEventListener("click", () => {
    const currentTab = getCurrentTab();
    if(!currentTab) return;
    if(!currentTab.items) currentTab.items = [];

    const nome = document.getElementById("itemName").value.trim() || "Item";
    const w = parseInt(document.getElementById("itemW").value) || 1;
    const h = parseInt(document.getElementById("itemH").value) || 1;
    const cols = state.config.cols;
    const rows = state.config.rows;

    let placed = false;
    for (let r = 0; r <= rows - h; r++) {
        for (let c = 0; c <= cols - w; c++) {
            if (canPlaceItem(null, c, r, w, h)) {
                currentTab.items.push({
                    id: "item_" + Date.now(),
                    nome: nome, imgUrl: "", descricao: "",
                    x: c, y: r, w: w, h: h,
                    category: "default",
                    color: CATEGORIES["default"]
                });
                saveState();
                placed = true; break;
            }
        }
        if (placed) break;
    }

    if (!placed) alert("Sem espaço suficiente nesta aba para este item!");
    document.getElementById("itemName").value = "";
});

/* =====================================================
   EDIÇÃO DE ITENS (MODAL)
   ===================================================== */
function openEditModal(itemId) {
    const items = getCurrentTab().items;
    const item = items.find(i => i.id === itemId);
    if (!item) return;
    editingItemId = itemId;
    document.getElementById("editItemName").value = item.nome || "";
    document.getElementById("editItemUrl").value = item.imgUrl || "";
    document.getElementById("editItemDesc").value = item.descricao || "";
    
    // Descobre a categoria atual (ou deduz a cor antiga para não quebrar compatibilidade)
    let catKey = item.category || "default";
    if (!item.category && item.color) {
        for (let k in CATEGORIES) {
            if (CATEGORIES[k].border === item.color.border) {
                catKey = k; break;
            }
        }
    }
    document.getElementById("editItemCategory").value = catKey;
    
    document.getElementById("editModal").style.display = "flex";
}

document.getElementById("btnSaveEdit").addEventListener("click", () => {
    if (!editingItemId) return;
    const currentTab = getCurrentTab();
    const item = currentTab.items.find(i => i.id === editingItemId);
    if (item) {
        item.nome = document.getElementById("editItemName").value.trim() || "Item";
        item.imgUrl = document.getElementById("editItemUrl").value.trim();
        item.descricao = document.getElementById("editItemDesc").value.trim();
        
        // Salva a nova categoria e cor correspondente
        const selectedCat = document.getElementById("editItemCategory").value;
        item.category = selectedCat;
        item.color = CATEGORIES[selectedCat];
        
        saveState();
    }
    document.getElementById("editModal").style.display = "none";
});
document.getElementById("btnCancelEdit").addEventListener("click", () => document.getElementById("editModal").style.display = "none");

function deleteItem(id) {
    if (activeItemPreview && activeItemPreview.id === id) activeItemPreview = null;
    const currentTab = getCurrentTab();
    currentTab.items = currentTab.items.filter(i => i.id !== id);
    saveState();
}

/* =====================================================
   CONFIGURAÇÃO DE GRID (MODAL)
   ===================================================== */
document.getElementById("btnOpenSettings").addEventListener("click", () => {
    document.getElementById("configCols").value = state.config.cols;
    document.getElementById("configRows").value = state.config.rows;
    document.getElementById("configModal").style.display = "flex";
});

document.getElementById("btnSaveConfig").addEventListener("click", () => {
    const c = parseInt(document.getElementById("configCols").value);
    const r = parseInt(document.getElementById("configRows").value);
    if(c >= 4 && r >= 4) {
        state.config.cols = c;
        state.config.rows = r;
        saveState();
    }
    document.getElementById("configModal").style.display = "none";
});
document.getElementById("btnCancelConfig").addEventListener("click", () => document.getElementById("configModal").style.display = "none");
