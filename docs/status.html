<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* =====================================================
   TOKENS — padrão dos callouts do Notion
   ===================================================== */
:root {
    color-scheme: light dark;

    --page-bg: #191919;
    --card-bg: transparent;          /* callout sem preenchimento */
    --card-border: #30302e;          /* mesma borda dos atributos */
    --card-radius: 8px;
    --track: rgba(255, 255, 255, 0.08);
    --ghost: rgba(255, 255, 255, 0.38);
    --check-ink: #191919;
}

/* MODO CLARO */
@media (prefers-color-scheme: light) {
    :root {
        --page-bg: #ffffff;
        --card-border: #e3e2e0;
        --track: rgba(55, 53, 47, 0.09);
        --ghost: rgba(55, 53, 47, 0.38);
        --check-ink: #ffffff;
    }
}

html, body {
    background-color: var(--page-bg) !important;
}

/* =====================================================
   CONFIGURAÇÃO GERAL
   ===================================================== */
* { box-sizing: border-box; }
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    min-height: 100%;
}
body {
    /* mesma pilha de fontes do Notion, para se misturar com a página */
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* =====================================================
   CONTAINER
   ===================================================== */
.status-container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

/* =====================================================
   STATUS (callout)
   ===================================================== */
.status {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--card-radius);
    /* 1px a menos de padding: a borda entra no lugar, altura idêntica */
    padding: 16px 16px 15px;
    margin-bottom: 12px;
    --status-color: #ffffff;
    /* versões suaves da cor do status (fallback + color-mix) */
    --status-soft: rgba(255, 255, 255, 0.10);
    --status-soft-strong: rgba(255, 255, 255, 0.18);
    --status-dim: var(--status-color);
}
@supports (color: color-mix(in srgb, red 50%, transparent)) {
    .status {
        --status-soft: color-mix(in srgb, var(--status-color) 14%, transparent);
        --status-soft-strong: color-mix(in srgb, var(--status-color) 26%, transparent);
        --status-dim: color-mix(in srgb, var(--status-color) 78%, transparent);
    }
}

/* =====================================================
   CORES
   ===================================================== */
.vida { --status-color: #ff4b4b; }
.sanidade { --status-color: #318cff; }
.empenho { --status-color: #27b879; }
.ocultismo { --status-color: #a958e8; }

/* =====================================================
   CABEÇALHO
   ===================================================== */
.status-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 11px;
    color: var(--status-color);
}
.status-icon {
    width: 17px;
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--status-color);
}
.status-icon svg {
    width: 16px;
    height: 16px;
    display: block;
}
.status-name {
    color: var(--status-color);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    line-height: 17px;
}

/* =====================================================
   LINHA DA BARRA
   ===================================================== */
.bar-wrapper {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 10px;
}

/* =====================================================
   BARRA
   ===================================================== */
.bar {
    flex: 1;
    height: 8px;
    background: var(--track);
    border-radius: 20px;
    overflow: hidden;
}
.bar-fill {
    height: 100%;
    width: 100%;
    background: var(--status-color);
    border-radius: 20px;
    transition: width 0.18s ease;
}

/* =====================================================
   CONTROLES DOS VALORES   [−]  28  [+]  /  28
   ===================================================== */
.values {
    display: grid;
    grid-template-columns: 20px 20px 20px 10px 33px;
    align-items: center;
    justify-content: end;
    width: 105px;
    height: 20px;
    flex-shrink: 0;
}

/* =====================================================
   BOTÕES − / +
   ===================================================== */
.adjust-button {
    width: 20px;
    height: 20px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--status-color);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.12s ease, background 0.12s ease, transform 0.08s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
.adjust-button:hover {
    opacity: 1;
    background: var(--status-soft);
}
.adjust-button:active {
    background: var(--status-soft-strong);
    transform: scale(0.92);
}
.adjust-button:focus-visible {
    opacity: 1;
    outline: 2px solid var(--status-color);
    outline-offset: 1px;
}
.decrease { grid-column: 1; }
.increase { grid-column: 3; }

/* =====================================================
   VALOR ATUAL E MÁXIMO
   ===================================================== */
.current, .maximum {
    height: 20px;
    min-width: 0;
    padding: 0;
    margin: 0;
    border: none;
    outline: none;
    border-radius: 5px;
    background: transparent;
    color: var(--status-color);
    font-family: inherit;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
    transition: background 0.12s ease, box-shadow 0.12s ease;
}
.current {
    grid-column: 2;
    width: 100%;
    text-align: center;
    font-weight: 700;
}
.maximum {
    grid-column: 5;
    width: 100%;
    padding-left: 5px;
    text-align: left;
  	font-weight: 700;   /* 400 = normal, 600 = semi, 700 = negrito */
    color: var(--status-dim);
}
.value-input:hover {
    background: var(--status-soft);
}
.value-input:focus {
    background: var(--status-soft);
    box-shadow: inset 0 0 0 1px var(--status-dim);
    color: var(--status-color);
}
.value-input::-webkit-inner-spin-button,
.value-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

/* =====================================================
   SEPARADOR
   ===================================================== */
.separator {
    grid-column: 4;
    width: 10px;
    color: var(--status-dim);
    font-size: 14px;
    font-weight: 300;
    line-height: 20px;
    text-align: center;
}

/* =====================================================
   CONDIÇÕES
   ===================================================== */
.conditions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 11px;
    margin-left: 24px;
    flex-wrap: wrap;
}
.condition {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--status-color);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.4px;
    line-height: 12px;
    cursor: pointer;
    user-select: none;
}
.condition input {
    appearance: none;
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    padding: 0;
    margin: 0;
    border: 1.5px solid var(--ghost);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 0.12s ease, border-color 0.12s ease;
}
.condition input:hover { border-color: var(--status-color); }
.condition input:focus-visible {
    outline: 2px solid var(--status-color);
    outline-offset: 2px;
}
.condition input:checked {
    background: var(--status-color);
    border-color: var(--status-color);
}
.condition input:checked::after {
    content: "";
    position: absolute;
    left: 2.5px;
    top: 0;
    width: 3px;
    height: 6px;
    border: solid var(--check-ink);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
}

/* =====================================================
   RESPONSIVO
   ===================================================== */
@media (max-width: 500px) {
    .status { padding: 15px 13px; }
    .bar-wrapper { gap: 7px; }
    .values { grid-template-columns: 19px 31px 19px 8px 31px; width: 108px; }
    .conditions { gap: 10px; margin-left: 21px; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}
</style>
</head>

<body>

<div class="status-container">

<!-- =====================================================
     VIDA
     ===================================================== -->
<div class="status vida" data-status="vida">
    <div class="status-header">
        <span class="status-icon">
            <svg viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
            </svg>
        </span>
        <span class="status-name">SAÚDE</span>
    </div>
    <div class="bar-wrapper">
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="values">
            <button class="adjust-button decrease" type="button" aria-label="Diminuir saúde">−</button>
            <input class="value-input current" aria-label="Saúde atual" type="number" min="0">
            <button class="adjust-button increase" type="button" aria-label="Aumentar saúde">+</button>
            <span class="separator">/</span>
            <input class="value-input maximum" aria-label="Saúde máximo" type="number" min="1">
        </div>
    </div>
    <div class="conditions">
        <label class="condition"><input type="checkbox" data-condition="inconsciente"><span>INCONSCIENTE</span></label>
        <label class="condition"><input type="checkbox" data-condition="morrendo"><span>MORRENDO</span></label>
        <label class="condition"><input type="checkbox" data-condition="morto"><span>MORTO</span></label>
    </div>
</div>

<!-- =====================================================
     SANIDADE
     ===================================================== -->
<div class="status sanidade" data-status="sanidade">
    <div class="status-header">
        <span class="status-icon">
            <svg viewBox="0 0 24 24">
                <path d="M9.5 3.5A3.5 3.5 0 0 0 6 7a3.5 3.5 0 0 0-2 6.35A3.5 3.5 0 0 0 6.5 20H9v-3.5a2 2 0 0 0-2-2H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14.5 3.5A3.5 3.5 0 0 1 18 7a3.5 3.5 0 0 1 2 6.35A3.5 3.5 0 0 1 17.5 20H15v-3.5a2 2 0 0 1 2-2h1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 7.5c1.2 0 2 .8 2 2v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M15 7.5c-1.2 0-2 .8-2 2v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M11 11h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="status-name">SANIDADE</span>
    </div>
    <div class="bar-wrapper">
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="values">
            <button class="adjust-button decrease" type="button" aria-label="Diminuir sanidade">−</button>
            <input class="value-input current" aria-label="Sanidade atual" type="number" min="0">
            <button class="adjust-button increase" type="button" aria-label="Aumentar sanidade">+</button>
            <span class="separator">/</span>
            <input class="value-input maximum" aria-label="Sanidade máximo" type="number" min="1">
        </div>
    </div>
    <div class="conditions">
        <label class="condition"><input type="checkbox" data-condition="insano"><span>INSANO</span></label>
    </div>
</div>

<!-- =====================================================
     EMPENHO
     ===================================================== -->
<div class="status empenho" data-status="empenho">
    <div class="status-header">
        <span class="status-icon">
            <svg viewBox="0 0 24 24">
                <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="currentColor"/>
            </svg>
        </span>
        <span class="status-name">ESFORÇO</span>
    </div>
    <div class="bar-wrapper">
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="values">
            <button class="adjust-button decrease" type="button" aria-label="Diminuir esforço">−</button>
            <input class="value-input current" aria-label="Esforço atual" type="number" min="0">
            <button class="adjust-button increase" type="button" aria-label="Aumentar esforço">+</button>
            <span class="separator">/</span>
            <input class="value-input maximum" aria-label="Esforço máximo" type="number" min="1">
        </div>
    </div>
</div>

<!-- =====================================================
     OCULTISMO
     ===================================================== -->
<div class="status ocultismo" data-status="ocultismo">
    <div class="status-header">
        <span class="status-icon">
            <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
            </svg>
        </span>
        <span class="status-name">OCULTISMO</span>
    </div>
    <div class="bar-wrapper">
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="values">
            <button class="adjust-button decrease" type="button" aria-label="Diminuir ocultismo">−</button>
            <input class="value-input current" aria-label="Ocultismo atual" type="number" min="0">
            <button class="adjust-button increase" type="button" aria-label="Aumentar ocultismo">+</button>
            <span class="separator">/</span>
            <input class="value-input maximum" aria-label="Ocultismo máximo" type="number" min="1">
        </div>
    </div>
</div>

</div>

<!-- =====================================================
     SCRIPT FIREBASE (TEMPO REAL)
     ===================================================== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Credenciais fornecidas
    const firebaseConfig = {
        apiKey: "AIzaSyD2qEEAPbzP1RFVnx2ijnEyCXB3VWzfz-8",
        authDomain: "ficha-verum.firebaseapp.com",
        databaseURL: "https://ficha-verum-default-rtdb.firebaseio.com",
        projectId: "ficha-verum",
        storageBucket: "ficha-verum.firebasestorage.app",
        messagingSenderId: "281172832426",
        appId: "1:281172832426:web:85442662439544144fa0d3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
// Captura o parâmetro "?player=" do link acessado
const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player') || 'jogador_teste';

// Monta o caminho dinâmico na árvore do Firebase
const dbRef = ref(db, `fichas/${playerName}_status`);
   
    const defaultValues = {
        vida: { current: 28, maximum: 28 },
        sanidade: { current: 49, maximum: 65 },
        empenho: { current: 92, maximum: 99 },
        ocultismo: { current: 18, maximum: 18 }
    };

    let localData = { values: defaultValues, conditions: {} };
    let isInitialized = false;

    // Listener que recebe as alterações na nuvem em tempo real
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        
        if (data) {
            localData = data;
        } else {
            set(dbRef, localData); 
        }

        updateUIFromData();
        isInitialized = true;
    });

    // Função que guarda os dados na base do Firebase
    function saveData() {
        if (!isInitialized) return;

        const dataToSave = { values: {}, conditions: {} };

        document.querySelectorAll(".status").forEach(status => {
            const name = status.dataset.status;

            dataToSave.values[name] = {
                current: Number(status.querySelector(".current").value),
                maximum: Number(status.querySelector(".maximum").value)
            };

            status.querySelectorAll("[data-condition]").forEach(box => {
                const condition = box.dataset.condition;
                if (!dataToSave.conditions[name]) {
                    dataToSave.conditions[name] = {};
                }
                dataToSave.conditions[name][condition] = box.checked;
            });
        });

        set(dbRef, dataToSave);
    }

    // Função que atualiza o ecrã sem interferir com quem está a escrever no momento
    function updateUIFromData() {
        document.querySelectorAll(".status").forEach(status => {
            const name = status.dataset.status;
            const savedValues = localData.values[name] || defaultValues[name];

            const currentInput = status.querySelector(".current");
            const maximumInput = status.querySelector(".maximum");
            
            if (document.activeElement !== currentInput) {
                currentInput.value = savedValues.current;
            }
            if (document.activeElement !== maximumInput) {
                maximumInput.value = savedValues.maximum;
            }

            const savedConditions = localData.conditions?.[name] || {};
            status.querySelectorAll("[data-condition]").forEach(box => {
                box.checked = savedConditions[box.dataset.condition] || false;
            });

            updateBarVisuals(status);
        });
    }

    // Calcula e renderiza a largura das barras de estado
    function updateBarVisuals(status) {
        const currentInput = status.querySelector(".current");
        const maximumInput = status.querySelector(".maximum");
        const fill = status.querySelector(".bar-fill");

        let current = Number(currentInput.value);
        let maximum = Number(maximumInput.value);

        if (isNaN(current) || current < 0) {
            current = 0;
            currentInput.value = 0;
        }
        if (isNaN(maximum) || maximum < 1) {
            maximum = 1;
            maximumInput.value = 1;
        }

        let percentage = (current / maximum) * 100;
        percentage = Math.max(0, Math.min(100, percentage));
        fill.style.width = percentage + "%";
    }

    // Altera os valores numéricos com os botões + e -
    function changeValue(status, amount) {
        const input = status.querySelector(".current");
        let value = Number(input.value);
        
        if (isNaN(value)) value = 0;
        
        value = Math.max(0, value + amount);
        input.value = value;
        
        updateBarVisuals(status);
        saveData();
    }

    // Atribuição dos Event Listeners aos botões e inputs
    document.querySelectorAll(".status").forEach(status => {
        status.querySelector(".decrease").addEventListener("click", () => changeValue(status, -1));
        status.querySelector(".increase").addEventListener("click", () => changeValue(status, 1));

        status.querySelectorAll(".current, .maximum").forEach(input => {
            input.addEventListener("change", () => {
                updateBarVisuals(status);
                saveData();
            });
        });

        status.querySelectorAll("[data-condition]").forEach(box => {
            box.addEventListener("change", saveData);
        });
    });
</script>

</body>
</html>
