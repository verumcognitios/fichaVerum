<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
    color-scheme: light dark;
    --bg: #191919; --border: #2f2f2f; --text: #ffffff; --text-soft: #9b9b9b;
    --field: #202020; --card: rgba(255,255,255,0.03); --hover: #2a2a2a; --danger: #ff4b4b;
    --accent: #8fb8ff; --accent-text: #0b1b33;
    --c-amarelo: #ffdc49; --c-verde: #4dab9a; --c-azul: #529cca; --c-vermelho: #ff7369;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg: #ffffff; --border: #e3e2e0; --text: #191919; --text-soft: #787774;
        --field: #f7f6f3; --card: rgba(0,0,0,0.02); --hover: #efeeeb;
        --accent: #2f7de1; --accent-text: #ffffff;
        --c-amarelo: #cb912f; --c-verde: #448361; --c-azul: #337ea9; --c-vermelho: #d44c47;
    }
}
* { box-sizing: border-box; }
html, body { background: var(--bg) !important; margin: 0 !important; padding: 0 !important; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; }
.status-container { width: 100%; height: 100%; padding: 1px; }
.status { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 6px; }

/* Cabeçalho */
.status-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--text); flex-shrink: 0; flex-wrap: wrap; }
.status-header svg { width: 18px; height: 18px; flex-shrink: 0; }
.status-name { font-size: 14px; font-weight: bold; letter-spacing: 0.3px; }
.head-tools { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mod-sel { background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 11px; outline: none; cursor: pointer; }
.mod-sel:focus { border-color: #555555; }
.btn { font-family: inherit; font-size: 11px; color: var(--text); background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--hover); }
.die-btn { display: flex; align-items: center; justify-content: center; background: none; border: none; padding: 2px; cursor: pointer; color: var(--accent); transition: opacity 0.15s; }
.die-btn:hover { opacity: 0.7; }
.die-btn svg { width: 18px; height: 18px; }
.die-btn.sm svg { width: 15px; height: 15px; }
.card-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.k-line { display: flex; align-items: center; gap: 6px; height: 14px; }
.k-line .die-btn { padding: 0; }
.k-line .die-btn svg { width: 14px; height: 14px; }
.k .short { display: none; }
@media (max-width: 420px) { .k.has-short .full { display: none; } .k.has-short .short { display: inline; } }
.k-line input { accent-color: var(--accent); margin: 0; width: 11px; height: 11px; cursor: pointer; opacity: 0.7; }
.no-ammo { font-size: 10px; color: var(--c-vermelho); }
.no-ammo.flash { animation: flash 0.5s ease 2; }
@keyframes flash { 50% { opacity: 0.2; } }

/* Lista com rolagem */
.scroll-area { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.scroll-area::-webkit-scrollbar { width: 6px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#list { display: flex; flex-direction: column; gap: 8px; }
.empty { font-size: 11px; color: var(--text-soft); padding: 4px 0; }

/* Formulário */
.form { display: none; grid-template-columns: repeat(6, 1fr); gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.form.open { display: grid; }
.form .s6 { grid-column: span 6; } .form .s4 { grid-column: span 4; } .form .s3 { grid-column: span 3; } .form .s2 { grid-column: span 2; }
.field { width: 100%; background: var(--field); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 6px; font-family: inherit; font-size: 12px; outline: none; transition: border-color 0.2s; }
.field::placeholder { color: var(--text-soft); }
.field:focus { border-color: #555555; }
.form-actions { grid-column: span 6; display: flex; gap: 8px; justify-content: flex-end; }

/* Cards de ataque */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-title { font-size: 14px; font-weight: bold; line-height: 1.3; word-break: break-word; }
.acts { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.icon-btn { cursor: pointer; color: var(--text-soft); font-size: 13px; line-height: 1; background: none; border: none; padding: 0; font-family: inherit; transition: opacity 0.15s; }
.icon-btn:hover { opacity: 0.7; }
.icon-btn.danger { color: var(--danger); font-size: 16px; font-weight: bold; }
.icon-btn.confirm { color: var(--danger); font-size: 11px; font-weight: bold; }
.pericia { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text-soft); }
.chip { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(127,127,127,0.15); }
.c1 { color: var(--text); } .c2 { color: var(--c-verde); } .c3 { color: var(--c-azul); }
.stats { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 10px; margin-top: 4px; }
.sep { flex: 0 0 1px; width: 1px; height: 31px; background: rgba(127,127,127,0.3); }
@media (max-width: 420px) { .sep { display: none; } .stats { justify-content: flex-start; gap: 8px 18px; } }
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 100%; flex: 0 0 auto; }
.stat .k { line-height: 14px; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-soft); }
.stat .v { font-size: 12px; color: var(--text); word-break: break-word; }
.ammo { display: flex; align-items: center; gap: 6px; }
.arrows { display: flex; flex-direction: column; }
.arrow { background: var(--field); border: 1px solid var(--border); color: var(--text-soft); font-size: 8px; line-height: 1; width: 20px; height: 13px; padding: 0; cursor: pointer; }
.arrow:first-child { border-radius: 4px 4px 0 0; } .arrow:last-child { border-radius: 0 0 4px 4px; border-top: none; }
.arrow:hover { background: var(--hover); color: var(--text); }
.cur { font-size: 15px; font-weight: bold; } .cur.zero { color: var(--danger); }
.max { font-size: 12px; color: var(--text-soft); }

/* Telinha de resultado (centralizada no módulo) */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
.overlay.open { display: flex; }
.modal { position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; width: min(340px, 100%); max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.m-close { position: absolute; top: 10px; right: 12px; font-size: 18px; }
.m-kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); font-weight: bold; margin: 0 18px 6px; }
.m-big { font-size: 46px; font-weight: bold; line-height: 1.1; margin: 4px 0 6px; }
.m-line { font-size: 12px; color: var(--text-soft); line-height: 1.5; margin-top: 4px; }
.m-grade { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; margin-top: 2px; }
.g-crit, .g-ext { color: var(--c-azul); } .g-hard { color: var(--c-verde); } .g-ok { color: var(--c-amarelo); }
.g-fail, .bad { color: var(--c-vermelho); }
</style>
</head>
<body>

<div class="status-container">
    <div class="status">
        <div class="status-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
            </svg>
            <span class="status-name">ATAQUES</span>
            <div class="head-tools">
                <select class="mod-sel" id="modSel" title="Vantagem ou desvantagem no próximo ataque">
                    <option value="0">Normal</option>
                    <option value="1">1 Vantagem</option>
                    <option value="2">2 Vantagens</option>
                    <option value="-1">1 Desvantagem</option>
                    <option value="-2">2 Desvantagens</option>
                </select>
                <button class="btn" id="btnAdd">+ Novo ataque</button>
            </div>
        </div>

        <div class="scroll-area" id="scrollArea">
            <div class="form" id="form">
                <input class="field s6" id="fNome" placeholder="Nome do ataque" autocomplete="off">
                <input class="field s4" id="fPericia" placeholder="Perícia (ex: Armas de Fogo)" autocomplete="off">
                <input class="field s2" id="fValor" type="number" min="0" placeholder="Valor %">
                <input class="field s6" id="fDano" placeholder="Dano (ex: 1d8 + 1d4)" autocomplete="off">
                <input class="field s2" id="fAlcance" placeholder="Alcance" autocomplete="off">
                <input class="field s2" id="fUsos" placeholder="Usos" autocomplete="off">
                <input class="field s2" id="fDefeito" type="number" min="0" placeholder="Defeito">
                <input class="field s3" id="fMax" type="number" min="0" placeholder="Munição máx. (vazio = sem)">
                <input class="field s3" id="fAtual" type="number" min="0" placeholder="Munição atual">
                <div class="form-actions">
                    <button class="btn" id="btnCancel">Cancelar</button>
                    <button class="btn" id="btnSave">Salvar</button>
                </div>
            </div>
            <div id="list"></div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* =====================================================
   FIREBASE (mesma configuração dos outros módulos)
   ===================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyD2qEEAPbzP1RFVnx2ijnEyCXB3VWzfz-8",
    authDomain: "ficha-verum.firebaseapp.com",
    databaseURL: "https://ficha-verum-default-rtdb.firebaseio.com",
    projectId: "ficha-verum",
    storageBucket: "ficha-verum.firebasestorage.app",
    messagingSenderId: "281172832426",
    appId: "1:281172832426:web:85442662439544144fa0d3"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const playerName = new URLSearchParams(window.location.search).get("player") || "jogador_teste";
const dbRef = ref(db, `fichas/${playerName}_ataques`);

/* =====================================================
   UTILITÁRIOS
   ===================================================== */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const num = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

// Sorteio sem viés (mesma ideia do Roller: aleatoriedade segura do navegador)
function rnd(n) {
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
}

/* =====================================================
   REGRAS DO TESTE (ajuste aqui se o sistema mudar)
   Padrão Call of Cthulhu: 01 = crítico; 100 (ou 96–100 se
   a perícia for menor que 50) = desastre; Bom = metade da
   perícia; Extremo = um quinto.
   ===================================================== */
function grau(r, v) {
    if (r === 1) return { txt: "SUCESSO CRÍTICO", cls: "g-crit" };
    if (v < 50 ? r >= 96 : r === 100) return { txt: "DESASTRE", cls: "g-fail" };
    if (r <= Math.floor(v / 5)) return { txt: "SUCESSO EXTREMO", cls: "g-ext" };
    if (r <= Math.floor(v / 2)) return { txt: "SUCESSO BOM", cls: "g-hard" };
    if (r <= v) return { txt: "SUCESSO NORMAL", cls: "g-ok" };
    return { txt: "FALHA", cls: "g-fail" };
}

// d100 com vantagem (n > 0) ou desvantagem (n < 0): rola 1 + |n| d100
// e fica com o MENOR valor na vantagem e o MAIOR na desvantagem
function d100(mod) {
    const rolls = Array.from({ length: 1 + Math.abs(mod) }, () => rnd(100) + 1);
    const total = mod > 0 ? Math.min(...rolls) : mod < 0 ? Math.max(...rolls) : rolls[0];
    return { total, rolls };
}

/* =====================================================
   ESTADO + FIREBASE
   ===================================================== */
let ataques = [];
let isInitialized = false;
let editingId = null, pendingDeleteId = null, gastarMunicao = true;

onValue(dbRef, (snap) => {
    const data = snap.val();
    ataques = Array.isArray(data) ? data : (data ? Object.values(data) : []);
    render();
    isInitialized = true;
});
function save() { if (isInitialized) set(dbRef, ataques); }

/* =====================================================
   TELINHA DE RESULTADO
   ===================================================== */
const overlay = $("overlay"), modalBox = $("modal");
const line = (t, cls) => el("div", "m-line " + (cls || ""), t);
function closeModal() { overlay.classList.remove("open"); }
function modal(kicker, big, bigCls, lines) {
    modalBox.innerHTML = "";
    const x = el("button", "icon-btn m-close", "×");
    x.addEventListener("click", closeModal);
    modalBox.append(x, el("div", "m-kicker", kicker), el("div", "m-big " + (bigCls || ""), big), ...lines);
    overlay.classList.add("open");
}
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* =====================================================
   ROLAGENS
   ===================================================== */
function atacar(a, c) {
    const gastar = gastarMunicao && a.ammoMax > 0;
    if (gastar && (a.ammoAtual || 0) <= 0) {
        const w = c && c.querySelector(".no-ammo");
        if (w) { w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash"); }
        return;
    }
    if (gastar) { a.ammoAtual--; save(); render(); }
    const mod = num($("modSel").value), r = d100(mod), v = a.valor || 0, lines = [];
    const g = v > 0 ? grau(r.total, v) : null;
    if (g) lines.push(line(g.txt, "m-grade " + g.cls));
    if (v > 0) lines.push(line((a.pericia || "Perícia") + " · [" + v + "] | [" + Math.floor(v / 2) + "] | [" + Math.floor(v / 5) + "]"));
    else lines.push(line("Sem valor de perícia: só o d100 foi rolado."));
    if (mod !== 0) lines.push(line((mod > 0 ? "Vantagem" : "Desvantagem") + " (" + Math.abs(mod) + "): rolou " + r.rolls.join(", ") + " → ficou " + r.total));
    if (a.defeito > 0 && r.total >= a.defeito) lines.push(line("DEFEITO: a arma falhou (resultado ≥ " + a.defeito + ")", "bad"));
    if (gastar) lines.push(line("Munição: " + a.ammoAtual + " / " + a.ammoMax));
    modal("ATAQUE · " + a.nome, String(r.total), g ? g.cls : "", lines);
    $("modSel").value = "0";
}

function dano(a) {
    const txt = a.dano || "";
    const m = txt.match(/\d*d\d+(?:\s*[+-]\s*(?:\d*d\d+|\d+))*/i);
    if (!m) { modal("DANO · " + a.nome, "—", "", [line("Não achei uma fórmula de dados (ex: 1d8 + 2) no campo Dano.")]); return; }
    const resto = (txt.slice(0, m.index) + " " + txt.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim();
    let total = 0; const lines = [];
    for (const t of m[0].matchAll(/([+-]?)\s*(?:(\d*)d(\d+)|(\d+))/gi)) {
        const s = t[1] === "-" ? -1 : 1;
        if (t[3]) {
            const q = Math.min(num(t[2]) || 1, 100), f = Math.min(num(t[3]), 1000);
            if (f < 1) continue;
            const vals = Array.from({ length: q }, () => rnd(f) + 1), sub = vals.reduce((x, y) => x + y, 0);
            total += s * sub;
            lines.push(line((s < 0 ? "−" : "") + q + "d" + f + ": " + vals.join(" + ") + (q > 1 ? " = " + sub : "")));
        } else {
            const n = num(t[4]); total += s * n;
            lines.push(line((s < 0 ? "−" : "+") + n));
        }
    }
    if (resto) lines.push(line("Não rolado (some à mão): " + resto));
    modal("DANO · " + a.nome, String(Math.max(0, total)), "", lines);
}

/* =====================================================
   RENDERIZAÇÃO
   ===================================================== */
const ATTACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l8.5 5v9l-8.5 5-8.5-5v-9z"/><path d="M12 8l4 7H8z"/></svg>';
const DAMAGE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>';

function lbl(full, short) {
    const k = el("span", short ? "k has-short" : "k");
    k.append(el("span", "full", full));
    if (short) k.append(el("span", "short", short));
    return k;
}

function stat(k, v, short) {
    const s = el("div", "stat");
    s.append(lbl(k, short), el("span", "v", v || "—"));
    return s;
}

function danoStat(a) {
    const s = el("div", "stat"), head = el("div", "k-line");
    const b = el("button", "die-btn sm");
    b.innerHTML = DAMAGE_ICON; b.title = "Rolar dano";
    b.addEventListener("click", () => dano(a));
    head.append(el("span", "k", "Dano"), b);
    s.append(head, el("span", "v", a.dano || "—"));
    return s;
}

function ammoStat(a) {
    const s = el("div", "stat"), k = el("div", "k-line");
    k.append(lbl("Munição", "Mun."));
    if (!(a.ammoMax > 0)) { s.append(k, el("span", "v", "—")); return s; }
    const cb = el("input");
    cb.type = "checkbox"; cb.checked = gastarMunicao; cb.title = "Gastar 1 de munição a cada ataque";
    cb.addEventListener("change", () => { gastarMunicao = cb.checked; render(); });
    k.append(cb);
    const w = el("div", "ammo"), arr = el("div", "arrows");
    const up = el("button", "arrow", "▲"), dn = el("button", "arrow", "▼");
    up.title = "Aumentar"; dn.title = "Reduzir";
    const adj = (d) => { a.ammoAtual = clamp((a.ammoAtual || 0) + d, 0, a.ammoMax); save(); render(); };
    up.addEventListener("click", () => adj(1));
    dn.addEventListener("click", () => adj(-1));
    arr.append(up, dn);
    const rl = el("button", "icon-btn", "↻");
    rl.title = "Recarregar (volta ao máximo)";
    rl.addEventListener("click", () => { a.ammoAtual = a.ammoMax; save(); render(); });
    w.append(arr, el("span", "cur" + ((a.ammoAtual || 0) <= 0 ? " zero" : ""), String(a.ammoAtual || 0)), el("span", "max", "/ " + a.ammoMax), rl);
    s.append(k, w);
    if ((a.ammoAtual || 0) <= 0) s.append(el("span", "no-ammo", "Sem munição"));
    return s;
}

function card(a) {
    const c = el("div", "card");

    const head = el("div", "card-head"), left = el("div", "card-left"), acts = el("div", "acts");
    const bA = el("button", "die-btn");
    bA.innerHTML = ATTACK_ICON; bA.title = "Rolar ataque";
    bA.addEventListener("click", () => atacar(a, c));
    left.append(el("div", "card-title", a.nome), bA);

    const ed = el("button", "icon-btn", "✎"); ed.title = "Editar";
    ed.addEventListener("click", () => openForm(a));
    const del = el("button", pendingDeleteId === a.id ? "icon-btn confirm" : "icon-btn danger", pendingDeleteId === a.id ? "Remover?" : "×");
    del.addEventListener("click", () => {
        if (pendingDeleteId === a.id) { ataques = ataques.filter(x => x.id !== a.id); pendingDeleteId = null; save(); render(); }
        else { pendingDeleteId = a.id; render(); setTimeout(() => { pendingDeleteId = null; render(); }, 3000); }
    });
    acts.append(ed, del);
    head.append(left, acts);

    const per = el("div", "pericia");
    per.append(el("span", "", a.pericia || "Sem perícia"));
    if (a.valor > 0) [a.valor, Math.floor(a.valor / 2), Math.floor(a.valor / 5)].forEach((v, i) => per.append(el("span", "chip c" + (i + 1), "[" + v + "]")));

    const stats = el("div", "stats");
    [danoStat(a), stat("Alcance", a.alcance), stat("Usos", a.usos), stat("Defeito", a.defeito > 0 ? String(a.defeito) : "", "Def."), ammoStat(a)]
        .forEach((n, i) => { if (i) stats.append(el("i", "sep")); stats.append(n); });

    c.append(head, per, stats);
    return c;
}

function render() {
    const list = $("list");
    list.innerHTML = "";
    if (!ataques.length) { list.appendChild(el("div", "empty", "Nenhum ataque ainda. Clique em “+ Novo ataque”.")); return; }
    ataques.forEach(a => list.appendChild(card(a)));
}

/* =====================================================
   FORMULÁRIO (novo / editar)
   ===================================================== */
const F = { nome: $("fNome"), pericia: $("fPericia"), valor: $("fValor"), dano: $("fDano"), alcance: $("fAlcance"), usos: $("fUsos"), defeito: $("fDefeito"), max: $("fMax"), atual: $("fAtual") };
const form = $("form");

function openForm(a) {
    editingId = a ? a.id : null;
    F.nome.value = a ? a.nome : "";
    F.pericia.value = a ? (a.pericia || "") : "";
    F.valor.value = a && a.valor ? a.valor : "";
    F.dano.value = a ? (a.dano || "") : "";
    F.alcance.value = a ? (a.alcance || "") : "";
    F.usos.value = a ? (a.usos || "") : "";
    F.defeito.value = a && a.defeito ? a.defeito : "";
    F.max.value = a && a.ammoMax ? a.ammoMax : "";
    F.atual.value = a && a.ammoMax ? a.ammoAtual : "";
    form.classList.add("open");
    $("scrollArea").scrollTop = 0;
    F.nome.focus();
}
function closeForm() { form.classList.remove("open"); editingId = null; }

$("btnAdd").addEventListener("click", () => openForm(null));
$("btnCancel").addEventListener("click", closeForm);
$("btnSave").addEventListener("click", () => {
    const nome = F.nome.value.trim();
    if (!nome) { F.nome.focus(); return; }
    const max = Math.max(0, num(F.max.value));
    const atual = clamp(F.atual.value === "" ? max : num(F.atual.value), 0, max);
    const obj = {
        nome, pericia: F.pericia.value.trim(), valor: Math.max(0, num(F.valor.value)),
        dano: F.dano.value.trim(), alcance: F.alcance.value.trim(), usos: F.usos.value.trim(),
        defeito: Math.max(0, num(F.defeito.value)), ammoMax: max, ammoAtual: atual
    };
    if (editingId) ataques = ataques.map(x => x.id === editingId ? { ...x, ...obj } : x);
    else ataques.push({ id: String(Date.now()), ...obj });
    save(); render(); closeForm();
});
F.nome.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); F.pericia.focus(); } });
</script>
</body>
</html>
